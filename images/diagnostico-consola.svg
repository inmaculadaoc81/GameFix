<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F4F6"/>
      <stop offset="1" stop-color="#E7E7EC"/>
    </linearGradient>
    <linearGradient id="padGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262E"/>
      <stop offset="1" stop-color="#111116"/>
    </linearGradient>
    <linearGradient id="redGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0342A"/>
      <stop offset="1" stop-color="#B4130C"/>
    </linearGradient>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bgGrad2)"/>
  <circle cx="260" cy="620" r="240" fill="#DEDEE4"/>

  <!-- controller centered -->
  <g filter="url(#soft2)" transform="translate(430,270)">
    <path d="M40 0
             C 10 0, -20 30, -20 90
             L -20 190
             C -20 250, 30 290, 75 260
             C 95 246, 108 220, 112 196
             C 116 220, 129 246, 149 260
             C 194 290, 244 250, 244 190
             L 244 90
             C 244 30, 214 0, 184 0
             Z" fill="url(#padGrad)" stroke="#3A3A44" stroke-width="2"/>
    <line x1="55" y1="95" x2="55" y2="145" stroke="#6b6b76" stroke-width="14" stroke-linecap="round"/>
    <line x1="30" y1="120" x2="80" y2="120" stroke="#6b6b76" stroke-width="14" stroke-linecap="round"/>
    <circle cx="175" cy="95" r="13" fill="url(#redGrad3)"/>
    <circle cx="175" cy="140" r="13" fill="#3A3A44"/>
    <circle cx="152" cy="118" r="13" fill="#3A3A44"/>
    <circle cx="198" cy="118" r="13" fill="#3A3A44"/>
  </g>

  <!-- magnifier -->
  <g filter="url(#soft2)" transform="translate(790,470)">
    <circle cx="0" cy="0" r="86" fill="#ffffff" fill-opacity="0.6" stroke="url(#redGrad3)" stroke-width="16"/>
    <line x1="58" y1="58" x2="140" y2="140" stroke="url(#redGrad3)" stroke-width="22" stroke-linecap="round"/>
  </g>

  <!-- diagnostic waveform card -->
  <g filter="url(#soft2)" transform="translate(700,180)">
    <rect x="0" y="0" width="200" height="110" rx="14" fill="#ffffff" stroke="#DEDEE4" stroke-width="2"/>
    <polyline points="16,70 46,40 70,80 100,30 130,60 160,20 184,55" fill="none" stroke="url(#redGrad3)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- status dots -->
  <circle cx="990" cy="330" r="10" fill="url(#redGrad3)"/>
  <circle cx="1020" cy="360" r="6" fill="#B7B7C0"/>
  <circle cx="330" cy="230" r="8" fill="#B7B7C0"/>
</svg>
