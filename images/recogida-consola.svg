    <rect x="360" y="380" width="300" height="60" fill="#8E0E09"/>
    <path d="M360 380 L510 460 L660 380" fill="none" stroke="#7A0D08" stroke-width="8"/>
    <path d="M510 460 L510 600" stroke="#7A0D08" stroke-width="6" stroke-dasharray="4 10"/>
    <path d="M452 300 L568 300 L552 392 Q510 408 468 392 Z" fill="#1B1B22" stroke="#0A0A0D" stroke-width="4"/>
