  </defs>
  <rect width="1200" height="800" fill="url(#bgGrad3)"/>
  <circle cx="960" cy="180" r="200" fill="#DEDEE4"/>
  <rect x="80" y="600" width="1040" height="16" rx="6" fill="#D7D7DE"/>

  <!-- box -->
